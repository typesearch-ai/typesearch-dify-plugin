identity:
  name: check_coverage
  author: typesearch
  label:
    en_US: Check index coverage
    zh_Hans: 查看索引覆盖范围
    ja_JP: インデックスのカバー範囲を確認
    pt_BR: Verificar cobertura do índice
description:
  human:
    en_US: "Check whether a news domain is in the typesearch index, or get the index coverage by country and language. Free."
    zh_Hans: "检查某个新闻域名是否在 typesearch 索引中，或查看索引按国家和语言的覆盖情况。免费。"
    ja_JP: "ニュースドメインが typesearch のインデックスに含まれているか、または国・言語別のカバー範囲を確認します。無料です。"
    pt_BR: "Verifica se um domínio de notícias está no índice do typesearch, ou mostra a cobertura do índice por país e idioma. Grátis."
  llm: "Check whether a news domain is in the typesearch index (pass domain), or get the index coverage: how many sources and articles, by country and by language. Free."
parameters:
  - name: domain
    type: string
    required: false
    form: llm
    label:
      en_US: Domain
      zh_Hans: 域名
      ja_JP: ドメイン
      pt_BR: Domínio
    human_description:
      en_US: "A news domain, such as example.com. Without it: the coverage by country and language."
      zh_Hans: "新闻域名，例如 example.com。不填写则返回按国家和语言的覆盖情况。"
      ja_JP: "ニュースドメイン（例：example.com）。省略すると国・言語別のカバー範囲を返します。"
      pt_BR: "Um domínio de notícias, como example.com. Sem ele: a cobertura por país e idioma."
    llm_description: "A news domain, such as example.com. Without it: the coverage by country and language."
extra:
